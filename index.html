<body data-page="home">

  <header class="nav">
    <a class="nav-brand" href="index.html"><span class="brand-sigil">&gt;</span> dylan</a>
    <nav class="nav-links" aria-label="Main">
      <a href="index.html" class="active">home</a>
      <a href="projects.html">projects</a>
      <a href="about.html">about</a>
      <a href="contact.html">contact</a>
    </nav>
    <button class="themebtn" id="themebtn" type="button" aria-label="Switch theme" title="Cycle theme">theme</button>
  </header>

  <main class="page page-home">
    <section class="hero">
      <h1>Dylan Uijthof</h1>
      <p class="lede">Full-Stack Developer</p>
      <p class="sub">I build fast, accessible things for the web.</p>
      <p class="hint">Try typing <code>cat portfolio.txt</code> below</p>
    </section>

    <section class="term-wrap">
      <div class="terminal" id="terminal">
        <header class="titlebar">
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="title" id="title">dylan@portfolio: ~</span>
          <span class="titlebar-note">type <code>help</code></span>
        </header>

        <div class="screen" id="screen" tabindex="-1">
          <div class="out" id="out" role="log" aria-live="polite" aria-label="Terminal output"></div>

          <form class="promptline" id="form" autocomplete="off">
            <label class="prompt" for="entry" id="prompt">
              <span class="user">dylan</span><span class="at">@</span><span class="host">portfolio</span><span class="colon">:</span><span class="path">~</span><span class="sigil">$</span>
            </label>
            <span class="entrywrap">
              <span class="entry" id="entryText"></span><span class="caret" id="caret" aria-hidden="true"></span>
              <input class="realinput" id="entry" type="text" name="cmd"
                     autocapitalize="off" autocorrect="off" autocomplete="off"
                     spellcheck="false" aria-label="Type a command and press Enter">
            </span>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    © <span id="year">2026</span> Dylan Uijthof · built with pure html/css/js
  </footer>

  <noscript>
